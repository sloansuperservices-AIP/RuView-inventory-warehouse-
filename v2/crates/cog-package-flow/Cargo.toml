[package]
name = "cog-package-flow"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Cognitum Cog: WiFi-CSI package-flow tracker (ADR-266). Turns an existing shop-floor AP grid into a mesh of directional RF tripwires — counts pallet/tote/forklift crossings at gates and does zone-to-zone flow accounting. Passive, no tags/cameras. Counts FLOW EVENTS, not static inventory; accuracy is simulated/DATA-GATED without labelled hardware."

[[bin]]
name = "cog-package-flow"
path = "src/main.rs"

[lib]
name = "cog_package_flow"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
axum = "0.7"
ureq = { version = "2", default-features = false, features = ["tls"] }

[dev-dependencies]
approx = "0.5"
